<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            width: 100px;
            height: 100px;
            background-color: blue;
            border-radius: 1000%;
        }
        .box2{
            width: 90px;
            height: 90px;
            background-color: pink;
            border-radius: 900%;
        }
        .box3{
            width: 80px;
            height: 80px;
            background-color:yellow;
            border-radius: 800%;
        }
        .box4{
            width: 70px;
            height: 70px;
            background-color: red;
            border-radius: 700%;
        }
        .box5{
            width: 60px;
            height: 60px;
            background-color: darkgoldenrod;
            border-radius: 600%;
        }
        .box6{
            width: 50px;
            height: 50px;
            background-color:purple;
            border-radius: 500%;
        }
        .box7{
            width: 40px;
            height: 40px;
            background-color: orange;
            border-radius: 400%;
        }
        .box8{
            width: 30px;
            height: 30px;
            background-color:navy;
            border-radius: 300%;
        }
        .box9{
            width: 20px;
            height: 20px;
            background-color:deepskyblue;
            border-radius: 200%;
        }
        .box10{
            width: 10px;
            height: 10px;
            background-color: lightcoral;
            border-radius: 100%;
        }
         
    </style>
</head>

<body>
    <div class="box1">
        <div class="box2">
            <div class="box3">
                <div class="box4">
                    <div class="box6">
                        <div class="box7">
                            <div class="box8">
                                <div class="box9">
                                    <div class="box10"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
